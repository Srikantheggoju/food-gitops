apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: food-ordering
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/YOUR_GITHUB_USERNAME/food-ordering-gitops.git
    targetRevision: HEAD
    path: helm-chart

  destination:
    server: https://kubernetes.default.svc
    namespace: food-ordering

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
