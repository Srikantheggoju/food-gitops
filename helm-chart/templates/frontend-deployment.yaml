apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-frontend
spec:
  replicas: {{ .Values.frontend.replicas }}

  selector:
    matchLabels:
      app: food-frontend

  template:
    metadata:
      labels:
        app: food-frontend

    spec:
      containers:
      - name: food-frontend

        image: {{ .Values.frontend.repository }}:{{ .Values.frontend.tag }}

        ports:
        - containerPort: 3000

