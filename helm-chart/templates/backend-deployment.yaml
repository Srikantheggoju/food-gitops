apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-backend

spec:
  replicas: {{ .Values.backend.replicas }}

  selector:
    matchLabels:
      app: food-backend

  template:
    metadata:
      labels:
        app: food-backend

    spec:
      containers:
      - name: food-backend

        image: {{ .Values.backend.repository }}:{{ .Values.backend.tag }}

        ports:
        - containerPort: 5000
